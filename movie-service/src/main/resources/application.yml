server:
  port: 8082

spring:
  application:
    name: movie-service
  datasource:
    url: jdbc:postgresql://localhost:5432/movie_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
